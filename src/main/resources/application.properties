spring.application.name=dasig-core
spring.profiles.active=local

# Render sets the PORT env var automatically
server.port=${PORT:8080}

# Calendar "today" for deadline alerts (Philippines)
app.business-timezone=Asia/Manila

# Public base URL of the frontend SPA (used for deep links in emails)
app.frontend.url=${APP_FRONTEND_URL:https://www.dasig-core.site}

# Database (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Load related records (committee, organizations, users) in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Counts SQL statements per request for the timing log below
spring.jpa.properties.hibernate.session_factory.statement_inspector=edu.cit.dasig_core.core.perf.QueryCounter

# Compress JSON responses (smaller downloads between the server and the browser)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Request timing log (time and SQL count per request). Off by default; set APP_PERF_LOG=true to measure.
app.perf-log=${APP_PERF_LOG:false}

# Multipart upload limits for KPI submission documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT
app.jwt-secret=${APP_JWT_SECRET}
app.jwt-expiration-milliseconds=86400000

# SMTP Credentials (Brevo)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Supabase Bucket
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=kpi-submissions

# LLM Creds
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL}